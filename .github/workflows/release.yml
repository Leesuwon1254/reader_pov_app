name: Release APK

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/reader_pov_${{ github.ref_name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Reader POV ${{ github.ref_name }}"
          body: |
            ## 변경 사항

            - **서버 웜업 기능** (`server_warmup_service.dart`): 앱 실행 시 Render 서버를 자동으로 깨워 첫 생성 대기시간 최소화
            - **API 설정 URL 저장 버그 수정**: 저장된 서버 주소가 설정 화면에 실제로 반영되지 않던 문제 수정
            - **에러 메시지 개선**: 네트워크 오류 종류(타임아웃·연결 실패·서버 오류)별로 친절한 안내 메시지 표시
            - **개인 IP 제거 및 기본 URL 변경**: 하드코딩된 개인 IP 제거, 기본값을 Render 서버 URL로 통일
            - **Deprecated API 교체**: `Color.withOpacity()` → `Color.withValues(alpha:)` (Flutter 최신 버전 대응)

            ## 설치 방법

            1. 아래 `reader_pov_${{ github.ref_name }}.apk` 다운로드
            2. Android 기기에서 설치 (출처를 알 수 없는 앱 허용 필요)
          files: |
            build/app/outputs/flutter-apk/reader_pov_${{ github.ref_name }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
